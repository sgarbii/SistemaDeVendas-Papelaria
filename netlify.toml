# Configuração do deploy no Netlify (seção 7 e 9.1).
#
# O build roda scripts/preparar-deploy.mjs, que:
#   1. confere se js/config.js foi preenchido e se a CSP abaixo usa o
#      mesmo projeto Supabase (senão o deploy falha com uma mensagem clara);
#   2. copia SÓ os arquivos do site para a pasta "publicar".
# Assim supabase/, tests/, scripts/, docs/ e node_modules/ NÃO vão para o ar.
[build]
  publish = "publicar"
  command = "node scripts/preparar-deploy.mjs"

# O build só precisa do Node (o site não tem bundler). As devDependencies
# (Vitest, esbuild, supabase-js para gerar o vendor) servem só para
# desenvolvimento, então o Netlify não as instala.
[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--omit=dev --ignore-scripts"

# RNF10: o Netlify já redireciona http:// para https:// em todo site
# (Domain management > HTTPS > "Force HTTPS", ligado por padrão).

# Cabeçalhos de segurança em todas as páginas.
# O id do projeto aqui precisa ser o mesmo de js/config.js.
[[headers]]
  for = "/*"
  [headers.values]
    # O navegador só usa HTTPS neste domínio por 1 ano
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Só roda script do próprio site, só conversa com o Supabase e o ViaCEP,
    # sem estilos ou scripts inline (protege contra XSS)
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https://eyadyrrgavrnlrhbisdr.supabase.co; connect-src 'self' https://eyadyrrgavrnlrhbisdr.supabase.co https://viacep.com.br; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
